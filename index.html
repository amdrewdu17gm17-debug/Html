<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HWLog v1.00</title>
<style>
:root{--blue:#165DFF;--orange:#FF7D00;--green:#00B42A;--red:#F53F3F;--bg:#FFFFFF;--panel:#F5F7FA;--mid:#C9CDD4;--text:#4E5969;--black:#1D2129;--muted:#86909C;--r48:48px;--r40:40px;--r32:32px;--r24:24px;--r16:16px;--e:cubic-bezier(.25,.1,.25,1);}
*{box-sizing:border-box} body{margin:0;font-family:"PingFang SC","SF Pro Text",-apple-system,sans-serif;background:var(--bg);color:var(--text);transition:all 1000ms var(--e)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:24px 24px 140px;position:relative}
.screen{display:none;animation:pageIn 1000ms var(--e)} .screen.active{display:block}
.card{background:#fff;border-radius:var(--r48);padding:24px;margin-bottom:24px;border:1px solid #edf1f5}
.soft{background:var(--panel)} .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.h1{font-size:28px;font-weight:600;color:var(--black);line-height:1.2}.h2{font-size:20px;font-weight:500;color:var(--black);line-height:1.2}.t16{font-size:16px}.t14{font-size:14px;color:var(--mid)}.t12{font-size:12px;color:var(--mid)}
.btn{border:none;border-radius:var(--r32);padding:12px 16px;font-size:16px;background:var(--blue);color:#fff;cursor:pointer;transition:all 500ms var(--e)} .btn:active{transform:scale(.9)}
.btn.g{background:#fff;color:var(--text);border:1px solid var(--mid)}
.iconBtn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center}
.task{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;padding:12px;border:1px solid #edf1f5;background:#fff;margin-top:8px;transition:all 600ms var(--e)}
.task .left{display:flex;gap:10px;align-items:center}.dot{width:24px;height:24px;border-radius:999px;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.dot.hw,.dot.quiz{background:var(--blue)}.dot.rem{background:var(--orange)}.dot.other{background:var(--mid)}
.done{color:var(--muted);text-decoration:line-through}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:min(432px,calc(100vw - 48px));height:64px;border-radius:40px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;justify-content:space-around;align-items:center;z-index:50;transition:transform 600ms var(--e),opacity 600ms var(--e)}
.bottom.hide{transform:translateX(-50%) translateY(120px);opacity:.3}
.nav{background:transparent;border:none;color:var(--mid);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all 800ms var(--e)}
.nav .ic{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--panel)}.nav.active{color:var(--blue);transform:scale(1.1)}.nav.active .ic{background:var(--blue);color:#fff}
.nav.inactive{transform:scale(.9)}
.fab{position:fixed;right:24px;bottom:116px;width:56px;height:56px;border-radius:999px;background:var(--blue);color:#fff;border:none;font-size:32px;line-height:1;z-index:60;box-shadow:0 4px 20px rgba(0,0,0,.15);cursor:pointer;transition:all 400ms var(--e)}
.fab:active{transform:scale(.9)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mini{border-radius:32px;background:#fff;padding:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100;transition:opacity 800ms var(--e)}.modal.open{display:flex}
.sheet{width:min(480px,100vw);max-height:90vh;overflow:auto;background:#fff;border-radius:40px 40px 0 0;padding:20px 24px 32px;animation:sheetIn 800ms var(--e)}
.grabber{width:40px;height:8px;background:#dce2ea;border-radius:20px;margin:0 auto 12px}
input,select,textarea{width:100%;border:1px solid #e7edf3;background:#fff;color:var(--text);border-radius:40px;padding:14px 16px;font-size:16px;margin-top:10px;transition:all 500ms var(--e)} textarea{min-height:180px}
.kv{display:flex;justify-content:space-between;font-size:16px;margin-top:10px}
.calendar-head{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
.day{border:none;background:#fff;border-radius:24px;min-height:44px;cursor:pointer;transition:all 400ms var(--e)}.day.quiz{background:rgba(22,93,255,.1);color:var(--blue)}.day.rem{background:rgba(255,125,0,.1);color:var(--orange)}.day.past,.day.done{background:#f1f4f7;color:var(--muted)}.day.today,.day.sel{background:var(--blue);color:#fff}
@keyframes pageIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(120px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{opacity:.8}50%{opacity:1}100%{opacity:.8}}
@keyframes zoomSlow{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.chars span{display:inline-block;opacity:0;transform:translateY(-10px);animation:charIn 1200ms var(--e) forwards}
@keyframes charIn{to{opacity:1;transform:none}}
</style>
</head><body><div class="app">
<section id="home" class="screen active"></section>
<section id="todo" class="screen"></section>
<section id="calendar" class="screen"></section>
<section id="me" class="screen"></section>
<section id="detail" class="screen"></section>
<section id="reminder" class="screen"></section>
<section id="aiSettings" class="screen"></section>
<section id="promptSettings" class="screen"></section>
<section id="subjectManager" class="screen"></section>
</div>
<button class="fab" id="fab">+</button>
<nav class="bottom" id="bottom"></nav>
<div class="modal" id="modal"></div>
<script>
const GREETINGS=["继续保持节奏！","今天也会超顺利。","先做最重要的一件事。","每一步都算数。","你正在稳步前进。","小目标，大完成。","专注当下，效率拉满。","今天也值得被记录。","保持专注，持续进步。","一步一步，稳赢。"];
const BG_CHOICES=[['green','#E8F8EE'],['blue','#EAF0FF'],['orange','#FFF2E8'],['grey','#F5F7FA'],['black','#EDEDED']];
const state={tab:'home',selectedDate:new Date(),month:new Date().getMonth(),year:new Date().getFullYear(),tasks:[],subjects:[{full:'数学',short:'MATH'},{full:'英语',short:'ENG'},{full:'科目A',short:'A'}],user:{name:'User20251091',intro:'#Youself intro'},ai:{model:'gpt-4.1-mini',customModel:'',promptHW:'',promptQuiz:'',promptOther:''},ocrDraft:[],ocrImage:'',scrollY:0};
for(let i=1;i<=15;i++){state.tasks.push({id:i,type:i%5===0?'Reminder':i%3===0?'Quiz':'Homework',subject:i%2?'MATH':'ENG',name:'Task '+i,time:(20+i)+' min',due:new Date(Date.now()+86400000*(i%8)).toISOString().slice(0,10),done:false,children:[{name:'子任务A',time:'15 min'},{name:'子任务B',time:'20 min'}]})}
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));
const fmt=(d)=>{const dt=new Date(d);return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`};
function save(){localStorage.setItem('hwlog_v100',JSON.stringify(state))}
function load(){try{const o=JSON.parse(localStorage.getItem('hwlog_v100')||'null');if(o){Object.assign(state,o);state.selectedDate=new Date(state.selectedDate)}}catch(e){}}
function animateGreeting(text){return `<div class='chars'>${[...text].map((c,i)=>`<span style="animation-delay:${i*100}ms">${c}</span>`).join('')}</div>`}
function nav(){const items=[['home','☰','首页'],['todo','☑','待办'],['calendar','◫','日历'],['me','◉','我的']];$('#bottom').innerHTML=items.map(([k,ic,lb])=>`<button class='nav ${state.tab===k?'active':'inactive'}' onclick="switchTab('${k}')"><div class='ic'>${ic}</div><div>${lb}</div></button>`).join('')}
function switchTab(t){state.tab=t;$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+t).classList.add('active');nav();save()}
function taskItem(t){const cls=t.done?'done':'';const ty=t.type==='Reminder'?'rem':t.type==='Quiz'?'quiz':t.type==='Homework'?'hw':'other';return `<div class='task ${cls}' draggable='true' ondragstart='dragStart(event,${t.id})' ondragover='dragOver(event)' ondrop='dragDrop(event,${t.id})'><div class='left'><button class='btn iconBtn dot ${ty}' onclick='toggleDone(${t.id})'>${t.type[0]}</button><div><div class='t16'>${t.subject} ${t.name}</div><div class='t14'>${t.time} · ${fmt(t.due)}</div></div></div><div class='row'><button class='btn g' onclick='openDetail(${t.id})'>详情</button><button class='btn g' onclick='delTask(${t.id})'>删除</button></div></div>`}
let dragId=null; function dragStart(e,id){dragId=id} function dragOver(e){e.preventDefault()} function dragDrop(e,targetId){e.preventDefault();const a=state.tasks.findIndex(x=>x.id===dragId),b=state.tasks.findIndex(x=>x.id===targetId);if(a<0||b<0)return;const [m]=state.tasks.splice(a,1);state.tasks.splice(b,0,m);renderAll();}
function renderHome(){const done=state.tasks.filter(t=>t.done).length,p=state.tasks.length?Math.round(done/state.tasks.length*100):0;const g=GREETINGS[Math.floor(Math.random()*GREETINGS.length)];$('#home').innerHTML=`<div class='card soft'><div class='row'><div><div class='h2' style='color:var(--blue)'>HWLog</div><div class='t12'>底部导航 顶部有日历 最新的</div></div><div class='t14'>${fmt(new Date())}</div></div><div class='h1'>Hello</div><div class='h2'>${state.user.name}</div>${animateGreeting(g)}</div><div class='card'><div class='row'><div class='h2'>To Do</div><button class='btn g' onclick="switchTab('todo')">全部</button></div>${state.tasks.slice(0,5).map(taskItem).join('')}</div><div class='card soft'><div class='row'><div class='h2'>学习统计</div><div class='t14'>本月</div></div><div class='grid2'><div class='mini'><div class='t12'>每日平均功课数量(月)</div><div class='h1' style='font-size:24px;color:var(--blue)'>${(state.tasks.length/30).toFixed(1)}</div></div><div class='mini'><div class='t12'>月亮 功课</div><div class='h1' style='font-size:24px'>${Math.floor(state.tasks.length*0.4)}</div></div><div class='mini'><div class='t12'>日完</div><div class='h1' style='font-size:24px;color:var(--green)'>${done}</div></div><div class='mini'><div class='t12'>每日平均Quiz</div><div class='h1' style='font-size:24px;color:var(--blue)'>${(state.tasks.filter(t=>t.type==='Quiz').length/30).toFixed(1)}</div></div><div class='mini'><div class='t12'>月亮Quiz</div><div class='h1' style='font-size:24px'>${state.tasks.filter(t=>t.type==='Quiz').length}</div></div><div class='mini'><div class='t12'>完成功课百分比</div><div class='h1' style='font-size:24px;color:var(--green)'>${p}%</div><div style='height:12px;border-radius:999px;background:#eef2f6'><div style='height:12px;border-radius:999px;width:${p}%;background:var(--green);transition:width 600ms var(--e)'></div></div></div></div></div><div class='card'><div class='row'><div class='h2'>Hello 2rdvlay</div><div class='t14'>${fmt(new Date())}</div></div>${state.tasks.filter(t=>!t.done).slice(0,3).map(taskItem).join('')}</div>`}
function renderTodo(){const filterButtons=[['Quiz','var(--blue)'],['Homework','var(--blue)'],['Reminder','var(--orange)'],['Completed','var(--green)']];$('#todo').innerHTML=`<div class='row'><div class='h1'>待办</div><button class='btn g iconBtn' onclick='openBatchEdit()'>✎</button></div><div class='t14'>${fmt(new Date())}</div><div class='card soft'><div class='grid2'>${filterButtons.map(([n,c])=>`<button class='btn' style='background:${c}' onclick="applyFilter('${n}')">${n}</button>`).join('')}</div></div><div class='card'><div class='row'><div class='h2'>今日待办</div><button class='btn g' onclick='sortByDue()'>按截止排序</button></div>${state.tasks.map(taskItem).join('')}<button class='btn' style='width:100%;margin-top:12px' onclick='openCreate()'>+ 新增任务</button></div>`}
let currentFilter='ALL';function applyFilter(k){currentFilter=k;let arr=[...state.tasks];if(k==='Completed')arr=arr.filter(t=>t.done);else if(k!=='ALL')arr=arr.filter(t=>t.type===k);$('#todo').querySelector('.card:last-child').innerHTML=`<div class='row'><div class='h2'>${k==='ALL'?'今日待办':k}</div><button class='btn g' onclick='renderTodo()'>重置</button></div>${arr.map(taskItem).join('')}<button class='btn' style='width:100%;margin-top:12px' onclick='openCreate()'>+ 新增任务</button>`}
function sortByDue(){state.tasks.sort((a,b)=>new Date(a.due)-new Date(b.due));renderAll()}
function renderCalendar(){const first=new Date(state.year,state.month,1),start=(first.getDay()+6)%7,days=new Date(state.year,state.month+1,0).getDate();let cells='';for(let i=0;i<start;i++)cells+=`<div></div>`;for(let d=1;d<=days;d++){const dayDate=new Date(state.year,state.month,d);const iso=dayDate.toISOString().slice(0,10);const tasks=state.tasks.filter(t=>t.due===iso);let cls='day';if(dayDate.toDateString()===new Date().toDateString())cls+=' today';else if(tasks.some(t=>t.type==='Quiz'))cls+=' quiz';else if(tasks.some(t=>t.type==='Reminder'))cls+=' rem';if(tasks.length&&tasks.every(t=>t.done)||dayDate<new Date(new Date().toDateString()))cls+=' past';if(state.selectedDate&&dayDate.toDateString()===new Date(state.selectedDate).toDateString())cls+=' sel';cells+=`<button class='${cls}' onclick='pickDate(${state.year},${state.month},${d})'>${d}</button>`}
const monthLabel=`${state.year}-${state.month+1}`;const selectedIso=new Date(state.selectedDate).toISOString().slice(0,10);const list=state.tasks.filter(t=>t.due===selectedIso);$('#calendar').innerHTML=`<div class='row'><div class='h1'>日历</div><div class='row'><button class='btn g iconBtn' onclick='prevMonth()'>◀</button><button class='btn g iconBtn' onclick='nextMonth()'>▶</button></div></div><div class='card soft'><div class='row'><div class='h2'>${monthLabel}</div><button class='btn g' onclick='toggleYearView()'>年视图</button></div><div class='calendar-head'>${['一','二','三','四','五','六','日'].map(w=>`<div class='t14' style='text-align:center'>${w}</div>`).join('')}</div><div class='calendar-grid'>${cells}</div></div><div class='card'><div class='row'><div class='h2'>${new Date(state.selectedDate).getDate()}th ${new Date(state.selectedDate).getMonth()+1}月</div><div class='t14'>共${list.length}项任务</div></div>${(list.length?list:[]).map(taskItem).join('')||'<div class="t14">无任务</div>'}</div>`}
function pickDate(y,m,d){state.selectedDate=new Date(y,m,d);renderCalendar()} function prevMonth(){if(state.month===0){state.month=11;state.year--}else state.month--;renderCalendar()} function nextMonth(){if(state.month===11){state.month=0;state.year++}else state.month++;renderCalendar()} function toggleYearView(){alert('已切换年视图（手势缩放逻辑可继续增强）')}
function renderMe(){$('#me').innerHTML=`<div class='card soft'><div class='row'><div style='display:flex;gap:12px;align-items:center'><div style='width:80px;height:80px;border-radius:999px;background:var(--blue);display:grid;place-items:center;color:#fff'>👤</div><div><div class='h1' style='font-size:24px'>${state.user.name}</div><div class='t14'>${state.user.intro}</div></div></div><button class='btn g' onclick='editProfile()'>编辑</button></div><div class='t12' style='margin-top:12px'>Background page click to change green, blue, orange, grey, black</div><div style='display:flex;gap:10px;margin-top:10px'>${BG_CHOICES.map(([n,c])=>`<button class='btn' style='width:24px;height:24px;padding:0;border-radius:999px;background:${c};border:2px solid #fff;box-shadow:0 0 0 1px #ddd' onclick="setBG('${c}')" title='${n}'></button>`).join('')}</div></div><div class='card'><div class='grid2'><button class='btn g' onclick="openAISettings()">AI设置</button><button class='btn g' onclick="switchTab('calendar')">日历</button><button class='btn g' onclick='openSubjectManager()'>科目管理</button><button class='btn g' onclick='openSystem()'>系统设置</button></div></div><div class='t12' style='text-align:center'>[HWLog ® v.1.00]</div>`}
function renderDetail(task){$('#detail').innerHTML=`<div class='row'><button class='btn g iconBtn' onclick="switchTab('todo')">←</button><div class='h2'>${fmt(new Date())}</div><button class='btn g iconBtn' onclick='editTask(${task.id})'>✎</button></div><div class='card soft'><div class='h1' style='font-size:28px'>${task.subject}（${task.subject}）</div>${task.children.map((c,i)=>`<div class='kv'><div>${i+1}. ${c.name}</div><div>${c.time}</div></div>`).join('')}</div><div class='card'><div class='kv'><div>预计总时长</div><div>${task.time}</div></div><div class='kv'><div>截止日期</div><div>${fmt(task.due)}</div></div><div class='kv'><div>完成状态</div><div>${task.done?'已完成':'未完成'}</div></div></div><button class='btn' style='width:100%' onclick='toggleDone(${task.id});switchTab("todo")'>标记完成</button>`}
function renderReminder(){const list=state.tasks.filter(t=>t.type==='Reminder');$('#reminder').innerHTML=`<div class='row'><button class='btn g iconBtn' onclick="switchTab('todo')">←</button><div class='h1'>Reminder</div><div></div></div><div class='card'>${list.map(taskItem).join('')||'<div class="t14">暂无提醒</div>'}</div>`}
function openAISettings(){switchTab('aiSettings');renderAISettings()} function renderAISettings(){$('#aiSettings').innerHTML=`<div class='row'><button class='btn g iconBtn' onclick="switchTab('me')">←</button><div class='h1'>AI设置</div><div></div></div><div class='card soft'><button class='btn g' style='width:100%;margin-bottom:8px' onclick='openPromptSettings()'>AI提示词设置</button><button class='btn g' style='width:100%;margin-bottom:8px' onclick='chooseModel()'>AI模型选择：${state.ai.model}</button><button class='btn g' style='width:100%' onclick='customModel()'>自定义模型配置</button></div>`}
function openPromptSettings(){switchTab('promptSettings');$('#promptSettings').innerHTML=`<div class='row'><button class='btn g iconBtn' onclick='openAISettings()'>←</button><div class='h1'>AI提示词设置</div><div></div></div><div class='card soft'><div class='h2'>作业识别Prompt</div><textarea id='p1'>${state.ai.promptHW||'[sent image] According to this figure, Track out of every words [OCR] text, Get text'}</textarea><div class='h2' style='margin-top:16px'>Quiz识别Prompt</div><textarea id='p2'>${state.ai.promptQuiz||'// Date DD/MM/YYYY (Today) // Homework // subject // [ ] To Do Name | 30 min |'}</textarea><div class='h2' style='margin-top:16px'>其他自定义Prompt</div><textarea id='p3'>${state.ai.promptOther||'必须output plain text，没有以下是exc、引擎等回答'}</textarea><button class='btn' style='width:100%;margin-top:12px' onclick='savePrompts()'>保存设置</button></div>`}
function savePrompts(){state.ai.promptHW=$('#p1').value;state.ai.promptQuiz=$('#p2').value;state.ai.promptOther=$('#p3').value;save();alert('已保存')}
function openSubjectManager(){switchTab('subjectManager');renderSubjectManager()} function renderSubjectManager(){$('#subjectManager').innerHTML=`<div class='row'><button class='btn g iconBtn' onclick="switchTab('me')">←</button><div class='h1'>科目管理</div><button class='btn g iconBtn' onclick='addSubject()'>＋</button></div><div class='card soft'><div class='row'><div class='h2'>科目原名</div><div class='h2'>科目简写</div></div>${state.subjects.map((s,i)=>`<div class='task'><div>${s.full}</div><div>${s.short}</div><div class='row'><button class='btn g' onclick='editSubject(${i})'>编辑</button><button class='btn g' onclick='removeSubject(${i})'>删除</button></div></div>`).join('')}</div>`}
function modal(html){$('#modal').classList.add('open');$('#modal').innerHTML=`<div class='sheet'><div class='grabber'></div>${html}</div>`} function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
function addSubject(){modal(`<div class='h2'>新增科目</div><input id='sf' placeholder='原名'/><input id='ss' placeholder='简写'/><div class='row' style='margin-top:12px'><button class='btn g' onclick='closeModal()'>取消</button><button class='btn' onclick='saveSubject()'>保存</button></div>`)}
function saveSubject(){const f=$('#sf').value.trim(),s=$('#ss').value.trim();if(!f||!s)return alert('请先补充必填项');state.subjects.push({full:f,short:s});closeModal();renderSubjectManager();save()}
function editSubject(i){const it=state.subjects[i];modal(`<div class='h2'>编辑科目</div><input id='sf' value='${it.full}'/><input id='ss' value='${it.short}'/><div class='row' style='margin-top:12px'><button class='btn g' onclick='closeModal()'>取消</button><button class='btn' onclick='updateSubject(${i})'>保存</button></div>`)}
function updateSubject(i){state.subjects[i]={full:$('#sf').value.trim(),short:$('#ss').value.trim()};closeModal();renderSubjectManager();save()}
function removeSubject(i){if(confirm('删除该科目?')){state.subjects.splice(i,1);renderSubjectManager();save()}}
function editProfile(){modal(`<div class='h2'>编辑资料</div><input id='un' value='${state.user.name}'/><input id='ui' value='${state.user.intro}'/><div class='row' style='margin-top:12px'><button class='btn g' onclick='closeModal()'>取消</button><button class='btn' onclick='saveProfile()'>保存</button></div>`)}
function saveProfile(){state.user.name=$('#un').value.trim()||state.user.name;state.user.intro=$('#ui').value.trim()||state.user.intro;closeModal();renderMe();renderHome();save()}
function chooseModel(){modal(`<div class='h2'>AI模型选择</div><button class='btn g' style='width:100%;margin-top:8px' onclick="pickModel('gpt-4.1-mini')">gpt-4.1-mini</button><button class='btn g' style='width:100%;margin-top:8px' onclick="pickModel('gpt-4.1')">gpt-4.1</button><button class='btn g' style='width:100%;margin-top:8px' onclick="pickModel('o4-mini')">o4-mini</button>`)}
function pickModel(m){state.ai.model=m;closeModal();renderAISettings();save()}
function customModel(){modal(`<div class='h2'>自定义模型配置</div><input id='cm' placeholder='API / 模型名' value='${state.ai.customModel||''}'/><button class='btn' style='margin-top:12px' onclick='saveCustomModel()'>保存</button>`)}
function saveCustomModel(){state.ai.customModel=$('#cm').value.trim();closeModal();renderAISettings();save()}
function openSystem(){alert('系统设置页面已预留，可继续扩展')}
function openBatchEdit(){alert('批量编辑模式已启用（可拖拽排序）')}
function openDetail(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;switchTab('detail');renderDetail(t)}
function editTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;modal(`<div class='h2'>编辑任务</div><input id='etSub' value='${t.subject}'/><input id='etName' value='${t.name}'/><input id='etTime' value='${t.time}'/><input id='etDue' type='date' value='${t.due}'/><select id='etType'><option ${t.type==='Homework'?'selected':''}>Homework</option><option ${t.type==='Quiz'?'selected':''}>Quiz</option><option ${t.type==='Reminder'?'selected':''}>Reminder</option><option ${t.type==='Others'?'selected':''}>Others</option></select><div class='row' style='margin-top:12px'><button class='btn g' onclick='closeModal()'>取消</button><button class='btn' onclick='saveEditTask(${id})'>保存</button></div>`)}
function saveEditTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.subject=$('#etSub').value.trim();t.name=$('#etName').value.trim();t.time=$('#etTime').value.trim();t.due=$('#etDue').value;t.type=$('#etType').value;closeModal();renderAll();switchTab('todo');save()}
function toggleDone(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;renderAll();save()}
function delTask(id){const i=state.tasks.findIndex(x=>x.id===id);if(i<0)return;state.tasks.splice(i,1);renderAll();save()}
function setBG(c){document.body.style.background=c;state.bg=c;save()}
function openCreate(){modal(`<div class='h2'>新增任务</div><input id='ns' placeholder='科目缩写'/><select id='nt'><option>Homework</option><option>Quiz</option><option>Reminder</option><option>Others</option></select><input id='nn' placeholder='任务名称'/><input id='nm' placeholder='预计时长 30 min'/><input id='nd' type='date'/><div class='row' style='margin-top:12px'><button class='btn g' onclick='closeModal()'>取消</button><button class='btn' onclick='saveTask()'>保存</button></div>`)}
function saveTask(){const s=$('#ns').value.trim(),t=$('#nt').value,n=$('#nn').value.trim(),m=$('#nm').value.trim(),d=$('#nd').value;if(!s||!n||!m||!d)return alert('请先补充必填项');state.tasks.unshift({id:Date.now(),type:t,subject:s,name:n,time:m,due:d,done:false,children:[{name:'子任务1',time:'15 min'}]});closeModal();renderAll();switchTab('todo');save()}
function openAIPipeline(){aiStep1()}
function aiStep1(){modal(`<div class='h2'>选择图片</div><div class='t14'>通过图片识别自动生成待办任务</div><button class='btn g' style='width:100%;margin-top:10px' onclick='mockPick("camera")'>相机拍摄</button><button class='btn g' style='width:100%;margin-top:10px' onclick='mockPick("album")'>相册选择</button><button class='btn g' style='width:100%;margin-top:10px' onclick='mockPick("file")'>文件选择</button><div class='row' style='margin-top:12px'><button class='btn g' onclick='closeModal()'>关闭</button><button class='btn' onclick='aiStep2()'>下一步</button></div>`)}
function mockPick(src){state.ocrImage=src;alert('已选择: '+src)}
function aiStep2(){modal(`<div class='h2'>AI分析中</div><div class='t14'>正在识别图片中的文字内容，请稍候</div><div style='height:180px;border-radius:32px;background:#dfe8ff;display:grid;place-items:center;margin-top:10px;position:relative;overflow:hidden;animation:zoomSlow 2000ms linear infinite'><div style='position:absolute;inset:0;background:rgba(0,0,0,.25)'></div><div style='position:relative;color:#fff;font-size:20px;animation:pulse 2000ms linear infinite'>AI分析中</div></div><div style='height:12px;background:#edf2f8;border-radius:999px;margin-top:12px;overflow:hidden'><div style='height:12px;background:var(--blue);width:100%;animation:zoomSlow 2000ms linear infinite'></div></div><div class='row' style='margin-top:12px'><button class='btn g' onclick='aiStep1()'>上一步</button><button class='btn' onclick='aiStep3()'>下一步</button></div>`)}
function aiStep3(){state.ocrDraft=[{subject:'科目A',name:'Homework from OCR',time:'30 min',due:new Date().toISOString().slice(0,10),type:'Homework'},{subject:'科目B',name:'Quiz from OCR',time:'25 min',due:new Date(Date.now()+86400000).toISOString().slice(0,10),type:'Quiz'}];modal(`<div class='h2'>识别结果</div><button class='btn g iconBtn' onclick='editOCR()'>✎</button>${state.ocrDraft.map((t,i)=>`<div class='task'><div><div>${t.subject} ${t.name}</div><div class='t14'>${t.time} · ${fmt(t.due)} · ${t.type}</div></div><button class='btn g' onclick='editOCRItem(${i})'>编辑</button></div>`).join('')}<div class='row' style='margin-top:12px'><button class='btn g' onclick='aiStep2()'>上一步</button><button class='btn' onclick='applyOCR()'>Applicate 提交</button></div>`)}
function editOCR(){alert('已进入全量编辑模式')} function editOCRItem(i){const t=state.ocrDraft[i];modal(`<div class='h2'>编辑识别项</div><input id='os' value='${t.subject}'/><input id='on' value='${t.name}'/><input id='ot' value='${t.time}'/><input id='od' type='date' value='${t.due}'/><select id='oy'><option ${t.type==='Homework'?'selected':''}>Homework</option><option ${t.type==='Quiz'?'selected':''}>Quiz</option><option ${t.type==='Reminder'?'selected':''}>Reminder</option></select><div class='row' style='margin-top:12px'><button class='btn g' onclick='aiStep3()'>取消</button><button class='btn' onclick='saveOCRItem(${i})'>保存</button></div>`)}
function saveOCRItem(i){const t=state.ocrDraft[i];t.subject=$('#os').value;t.name=$('#on').value;t.time=$('#ot').value;t.due=$('#od').value;t.type=$('#oy').value;aiStep3()}
function applyOCR(){for(const t of state.ocrDraft){if(!t.subject||!t.name||!t.time||!t.due)return alert('请先补充必填项');state.tasks.unshift({id:Date.now()+Math.random(),type:t.type,subject:t.subject,name:t.name,time:t.time,due:t.due,done:false,children:[{name:'OCR子任务',time:t.time}]})}closeModal();renderAll();switchTab('todo');save();alert('已同步到列表与日历')}
function renderAll(){renderHome();renderTodo();renderCalendar();renderMe();renderReminder();if(state.tab==='detail'){switchTab('todo')} if(state.bg)document.body.style.background=state.bg;nav()}
window.addEventListener('scroll',()=>{const y=window.scrollY;$('#bottom').classList.toggle('hide',y>state.scrollY+4);state.scrollY=y});
$('#fab').onclick=openAIPipeline;
load();renderAll();switchTab(state.tab||'home');
</script>
